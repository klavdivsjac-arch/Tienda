.bn{position:relative; width:100%; aspect-ratio:16/7; overflow:hidden; border-radius:16px; background:#eee; perspective:900px; touch-action:pan-y; margin:4px 0 14px;}

.bn[data-fx="fade"] .bn-slide{opacity:0;} .bn[data-fx="fade"] .bn-slide.on{opacity:1;}
.bn[data-fx="slide"] .bn-slide{transform:translateX(100%);} .bn[data-fx="slide"] .bn-slide.on{transform:translateX(0);} .bn[data-fx="slide"] .bn-slide.prev{transform:translateX(-100%);}
.bn[data-fx="up"] .bn-slide{transform:translateY(100%);} .bn[data-fx="up"] .bn-slide.on{transform:translateY(0);} .bn[data-fx="up"] .bn-slide.prev{transform:translateY(-100%);}
.bn[data-fx="zoom"] .bn-slide{opacity:0; transform:scale(1.35);} .bn[data-fx="zoom"] .bn-slide.on{opacity:1; transform:scale(1);} .bn[data-fx="zoom"] .bn-slide.prev{opacity:0; transform:scale(.8);}

.bn[data-fx="wipe"] .bn-slide{clip-path:inset(0 100% 0 0);} .bn[data-fx="wipe"] .bn-slide.on{clip-path:inset(0 0 0 0);} .bn[data-fx="wipe"] .bn-slide.prev{clip-path:inset(0 0 0 0);}
.bn[data-fx="blur"] .bn-slide{opacity:0; filter:blur(18px);} .bn[data-fx="blur"] .bn-slide.on{opacity:1; filter:blur(0);} .bn[data-fx="blur"] .bn-slide.prev{opacity:0; filter:blur(18px);}
.bn[data-fx="spin"] .bn-slide{opacity:0; transform:rotate(-12deg) scale(.6);} .bn[data-fx="spin"] .bn-slide.on{opacity:1; transform:rotate(0) scale(1);} .bn[data-fx="spin"] .bn-slide.prev{opacity:0; transform:rotate(12deg) scale(1.3);}

function secureId(p){
  let r = '';
  try{ const a = new Uint8Array(12); crypto.getRandomValues(a); r = Array.from(a).map(x=>(x%36).toString(36)).join(''); }catch(e){ r = Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,10); }

async function dbLoad(key){
  try{
    if(!db) return null;
    const snap = await db.collection(FIRESTORE_COLLECTION).doc(key).get();
    return snap.exists ? snap.data().data : null;
  }catch(e){ console.error(e); return null; }
}
async function dbSave(key, value){
  try{
    if(!db) throw new Error('Firebase no está configurado todavía.');
    await db.collection(FIRESTORE_COLLECTION).doc(key).set({data: value});
    return true;
  }catch(e){
    console.error(e);
    toast('No se pudo guardar: ' + (e && e.message ? e.message : 'error desconocido') + '. Revisá tu configuración de Firebase.');
    return false;
  }
}
function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise(resolve => setTimeout(()=>resolve('__timeout__'), ms))
  ]);
}

let ordersUnsub = null;
function beep(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
    const c = new AC(); const o = c.createOscillator(); const g = c.createGain();
    o.connect(g); g.connect(c.destination); o.frequency.value = 880; g.gain.value = 0.15;
    o.start(); setTimeout(()=>{ o.frequency.value = 1180; }, 150); setTimeout(()=>{ o.stop(); c.close(); }, 320);
  }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate([150,80,150]); }catch(e){}
}
// Administrador: escucha TODOS los pedidos en vivo y recibe aviso apenas entra uno.
function startOrdersListener(){
  if(ordersUnsub || !db || !adminSession) return;
  let first = true;
  try{
    ordersUnsub = db.collection(FIRESTORE_COLLECTION).orderBy(firebase.firestore.FieldPath.documentId()).startAt('order_').endAt('order_\uf8ff').onSnapshot(snap=>{
      const data = {};
      snap.forEach(d=>{ const o = d.data() && d.data().data; if(o && o.id) data[o.id] = o; });
      const before = JSON.stringify(ORDERS);
      const known = new Set(Object.keys(ORDERS));
      const fresh = Object.values(data).filter(o=>!known.has(o.id));
      ORDERS = data;
      if(!first && adminSession && fresh.length){
        beep();
        toast('🧾 ¡Nuevo pedido de ' + fresh[fresh.length-1].customerName + '!');
      }
      first = false;
      if(JSON.stringify(ORDERS) === before) return;
      const {parts} = parseHash();
      const live = (parts[0]==='admin' && (!parts[1] || parts[1]==='pedidos')) || (parts[0]==='pedido' && parts[1]);
      if(live) render();
    }, err=>{ console.error(err); ordersUnsub = null; });
  }catch(e){ console.error(e); }
}
function stopOrdersListener(){ if(ordersUnsub){ try{ ordersUnsub(); }catch(e){} ordersUnsub = null; } }
// Cliente: sigue SOLO su pedido (por su link) y ve cambiar el estado sin recargar.
let orderWatch = {}, ORDER_MISSING = {};
function watchOrder(id){
  if(orderWatch[id] || !db) return;
  try{
    orderWatch[id] = db.collection(FIRESTORE_COLLECTION).doc('order_'+id).onSnapshot(snap=>{
      const o = snap.exists ? (snap.data() && snap.data().data) : null;
      if(o){ const same = JSON.stringify(ORDERS[id]) === JSON.stringify(o); ORDERS[id] = o; if(same) return; }
      else if(!ORDERS[id]){ ORDER_MISSING[id] = true; }
      const {parts} = parseHash();
      if(parts[0]==='pedido' && parts[1]===id) render();
    }, err=>{ console.error(err); orderWatch[id] = null; ORDER_MISSING[id] = true; const {parts} = parseHash(); if(parts[0]==='pedido' && parts[1]===id) render(); });
  }catch(e){ console.error(e); }
}

/* ---------------- banner publicitario ---------------- */
const BANNER_EFFECTS = [
  ['slide','↔️ Deslizar'],['up','↕️ Subir'],['fade','🌫️ Desvanecer'],['zoom','🔍 Zoom'],
  ['flip','🔄 Giro 3D'],['wipe','🪟 Cortina'],['blur','💨 Desenfoque'],['spin','🌀 Giro con zoom'],['mix','🎲 Aleatorio (mezcla)']
];
let BANNERS = {items:[], effect:'slide', seconds:4};
let bannerTimer = null, bannerIdx = 0, bannerList = [], bannerMix = false, bannerPreview = false;
function bannerNorm(link){
  link = String(link||'').trim(); if(!link) return '';
  if(link[0]==='#' || /^https?:\/\//i.test(link)) return link;
  return 'https://' + link;
}
function bannerHtml(items, effect, preview){
  if(!items || !items.length) return '';
  const fx = effect==='mix' ? 'fade' : (effect||'slide');
  return `<div class="bn" id="bn" data-fx="${fx}">
    ${items.map((b,i)=>`<div class="bn-slide ${i===0?'on':''}" onclick="bannerClick(${i})"><img src="${b.img}" alt="Publicidad"></div>`).join('')}
    ${items.length>1 ? `<div class="bn-dots">${items.map((b,i)=>`<span class="bn-dot ${i===0?'on':''}" onclick="event.stopPropagation(); bannerGo(${i}, true)"></span>`).join('')}</div>` : ''}
  </div>`;
}
function bannerClick(i){
  if(bannerPreview) return;
  if(window.__bnMoved) return;
  const b = bannerList[i]; const link = b && bannerNorm(b.link);
  if(!link) return;
  if(link[0]==='#') navigate(link); else window.open(link, '_blank', 'noopener');
}
function bannerGo(n, manual){
  const el = document.getElementById('bn'); if(!el) return;
  const slides = el.querySelectorAll('.bn-slide'); const dots = el.querySelectorAll('.bn-dot');
  const len = slides.length; if(len<2) return;
  const prev = bannerIdx; bannerIdx = ((n%len)+len)%len;
  if(bannerMix){ const all = BANNER_EFFECTS.map(e=>e[0]).filter(x=>x!=='mix'); el.setAttribute('data-fx', all[Math.floor(Math.random()*all.length)]); }
  slides.forEach((s,i)=>{ s.classList.toggle('on', i===bannerIdx); s.classList.toggle('prev', i===prev && prev!==bannerIdx); });
  dots.forEach((d,i)=>d.classList.toggle('on', i===bannerIdx));
  if(manual) startBanner(window.__bnSeconds);
}
function stopBanner(){ if(bannerTimer){ clearInterval(bannerTimer); bannerTimer=null; } }
function startBanner(seconds){
  stopBanner();
  const el = document.getElementById('bn'); if(!el) return;
  window.__bnSeconds = seconds;
  if(el.querySelectorAll('.bn-slide').length<2) return;
  bannerTimer = setInterval(()=>bannerGo(bannerIdx+1), Math.max(1, Number(seconds)||4)*1000);
  if(!el.__swipe){
    el.__swipe = true; let x0=null;
    el.addEventListener('touchstart', e=>{ x0=e.touches[0].clientX; window.__bnMoved=false; }, {passive:true});
    el.addEventListener('touchend', e=>{
      if(x0===null) return; const dx = e.changedTouches[0].clientX - x0; x0=null;
      if(Math.abs(dx)>40){ window.__bnMoved=true; setTimeout(()=>{window.__bnMoved=false;},300); bannerGo(bannerIdx + (dx<0?1:-1), true); }
    }, {passive:true});
  }
}
function setupBannerOnPage(items, effect, seconds, preview){
  bannerList = items; bannerIdx = 0; bannerMix = (effect==='mix'); bannerPreview = !!preview;
  startBanner(seconds);
}

function bnRenderList(){
  const box = document.getElementById('bn-list'); if(!box) return;
  if(!bnForm.items.length){ box.innerHTML = '<p class="hint">Todavía no cargaste fotos.</p>'; return; }
  box.innerHTML = bnForm.items.map((b,i)=>`
    <div class="bn-row">
      <img src="${b.img}">
      <input class="field" style="flex:1; min-width:0;" list="bn-links" placeholder="Link al tocar (opcional)" value="${escapeHtml(b.link||'')}" oninput="bnForm.items[${i}].link=this.value">
      <div style="display:flex; flex-direction:column; gap:4px;">
        <button type="button" class="btn btn-outline btn-sm" ${i===0?'disabled':''} onclick="bnMove(${i},-1)">↑</button>
        <button type="button" class="btn btn-outline btn-sm" ${i===bnForm.items.length-1?'disabled':''} onclick="bnMove(${i},1)">↓</button>
      </div>
      <button type="button" class="btn btn-danger btn-sm" onclick="bnRemove(${i})">✕</button>
    </div>`).join('');
}
function bnRefreshPreview(){
  const box = document.getElementById('bn-preview'); if(!box) return;
  box.innerHTML = bannerHtml(bnForm.items, bnForm.effect, true);
  setupBannerOnPage(bnForm.items, bnForm.effect, bnForm.seconds, true);
}
function bnRefreshAll(){ bnRenderList(); bnRefreshPreview(); }
function bnMove(i,d){ const j=i+d; if(j<0||j>=bnForm.items.length) return; const a=bnForm.items; [a[i],a[j]]=[a[j],a[i]]; bnRefreshAll(); }
function bnRemove(i){ const b=bnForm.items.splice(i,1)[0]; if(b && !b.isNew) bnRemoved.push(b.id); bnRefreshAll(); }
function bnAddFiles(ev){
  const files = Array.from(ev.target.files||[]);
  let pending = files.length; if(!pending) return;
  files.forEach(file=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 900; let w=img.width, h=img.height;
        if(w>maxW){ h=h*maxW/w; w=maxW; }
        const c = document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        bnForm.items.push({id:uid('bn'), img:c.toDataURL('image/jpeg',0.7), link:'', isNew:true});
        if(--pending===0){ bnRefreshAll(); ev.target.value=''; }
      };
      img.onerror = ()=>{ if(--pending===0) bnRefreshAll(); };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
async function saveBanners(btn){
  if(btn) btn.disabled = true;
  try{
    for(const b of bnForm.items){ if(b.isNew){ const ok = await withTimeout(dbSave('banner_'+b.id, b.img), 15000); if(ok===false||ok==='__timeout__'){ toast('No se pudo guardar una foto.'); return; } } }
    for(const id of bnRemoved){ try{ await db.collection(FIRESTORE_COLLECTION).doc('banner_'+id).delete(); }catch(e){} }
    const idx = { effect: bnForm.effect, seconds: bnForm.seconds, items: bnForm.items.map(b=>({id:b.id, link:bannerNorm(b.link)})) };
    const ok = await withTimeout(dbSave('banners', idx), 10000);
    if(ok===false||ok==='__timeout__') return;
    BANNERS = { effect: idx.effect, seconds: idx.seconds, items: bnForm.items.map(b=>({id:b.id, img:b.img, link:bannerNorm(b.link)})) };
    bnForm.items.forEach(b=>{ delete b.isNew; }); bnRemoved = [];
    toast('Banner guardado.');
  } finally { if(btn) btn.disabled = false; }
}

/* ---------------- carrito de compras (solo en este navegador) ---------------- */
// Esta app vive en Netlify (no dentro de Claude), así que localStorage
// funciona normalmente y es lo correcto para un carrito por dispositivo.
function getCart(){
  try{ return JSON.parse(localStorage.getItem('mt_cart')||'[]'); }
  catch(e){ return []; }
}
function saveCart(cart){
  try{ localStorage.setItem('mt_cart', JSON.stringify(cart)); }catch(e){}
}
function lineKey(productId, variantName){ return productId + '::' + (variantName||''); }
function addToCart(productId, qty, variantName){
  qty = Math.max(1, Number(qty)||1);
  variantName = variantName || '';
  const cart = getCart();
  const key = lineKey(productId, variantName);
  const existing = cart.find(i=>lineKey(i.productId, i.variantName)===key);
  if(existing) existing.qty += qty;
  else cart.push({productId, qty, variantName});
  saveCart(cart);
  toast('Agregado al carrito.');
  render();
}
function updateCartQty(productId, variantName, qty){
  qty = Number(qty);
  const key = lineKey(productId, variantName);
  let cart = getCart();
  if(qty<=0){ cart = cart.filter(i=>lineKey(i.productId, i.variantName)!==key); }
  else{ const it = cart.find(i=>lineKey(i.productId, i.variantName)===key); if(it) it.qty = qty; }
  saveCart(cart);
  render();
}
function removeFromCart(productId, variantName){
  const key = lineKey(productId, variantName);
  saveCart(getCart().filter(i=>lineKey(i.productId, i.variantName)!==key));
  render();
}
function clearCart(){ saveCart([]); }
function cartLineItems(){
  return getCart().map(i=>{
    const p = PRODUCTS[i.productId];
    if(!p) return null;
    const baseVn = String(i.variantName||'').split(' · ')[0];
    const variant = (p.variants||[]).find(v=>v.name===baseVn);
    const price = p.price + (variant ? Number(variant.priceDelta)||0 : 0);
    return {
      productId:i.productId, name:p.name, variantName:i.variantName||'', price, qty:i.qty,
      image:(p.images&&p.images[0])||PLACEHOLDER_IMG, status:p.status
    };
  }).filter(Boolean);
}
function cartCount(){ return getCart().reduce((a,i)=>a+i.qty,0); }
function cartSubtotal(){ return cartLineItems().reduce((a,i)=>a+i.price*i.qty,0); }
function cartTotal(){ return cartSubtotal(); }

function setupPWA(){
  try{
    if(!CONFIG) return;
    const logoIcon = (CONFIG.logo && CONFIG.logo.startsWith('data:')) ? CONFIG.logo : PLACEHOLDER_IMG;
    const manifest = {
      name: CONFIG.businessName, short_name: CONFIG.businessName.slice(0,12),
      start_url: baseUrl(), display: 'standalone', background_color:'#FAF7F1', theme_color:'#F2A027',
      icons:[{src:logoIcon, sizes:'192x192', type:'image/jpeg'}]
    };
    const blob = new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'});
    const link = document.getElementById('pwa-manifest');
    if(link) link.href = URL.createObjectURL(blob);
  }catch(e){ console.error('PWA setup', e); }
}

/* ---------------- router ---------------- */
function navigate(hash){
  if(location.hash === hash || (location.hash==='' && hash==='#/')){ render(); }
  else{ location.hash = hash; }
}
window.addEventListener('hashchange', render);
function parseHash(){
  const raw = location.hash.replace(/^#\/?/, '');
  const [pathPart, queryPart] = raw.split('?');
  const parts = pathPart.split('/').filter(Boolean);
  const query = {};
  if(queryPart) new URLSearchParams(queryPart).forEach((v,k)=>query[k]=v);
  return {parts, query};
}

function isService(p){ return !!p && p.kind==='servicio'; }

function isLowStock(p){
  if(isService(p) || !cartOn(p)) return false;
  const threshold = (CONFIG && CONFIG.lowStockThreshold) || 3;
  return p.status==='activo' && p.stock!=null && Number(p.stock)>0 && Number(p.stock)<=threshold;
}
function productCard(p){
  const img = (p.images && p.images[0]) || PLACEHOLDER_IMG;
  const discount = p.oldPrice ? Math.round(100-(p.price/p.oldPrice*100)) : 0;
  const hasVariants = p.variants && p.variants.length>0;
  const minPrice = hasVariants ? Math.min(p.price, ...p.variants.map(v=>p.price+(Number(v.priceDelta)||0))) : p.price;
  return `
  <div class="card-product ${isService(p)?'srv':''}" onclick="navigate('#/producto/${p.id}')">
    <div class="imgwrap">
      <img src="${img}" alt="${escapeHtml(p.name)}" loading="lazy">
      ${discount>0?`<div class="badge">-${discount}%</div>`:''}
      ${p.status==='agotado'?`<div class="badge-out">${t('Sin stock')}</div>`:''}
    </div>
    <div class="info">
      <div class="name">${escapeHtml(p.name)}</div>
      <div class="price-row">
        ${!hasPrice(p) ? `<span class="price" style="font-size:13px;">Consultar</span>` : hasVariants ? `<span class="price">Desde ${money(minPrice)}</span>` : `
          <span class="price">${money(p.price)}</span>
          ${p.oldPrice?`<span class="price-old">${money(p.oldPrice)}</span>`:''}

      ${isLowStock(p) ? `<div class="hint" style="color:var(--coral); font-weight:700;">¡Últimas ${p.stock} unidades!</div>` : ''}

function handleLogoUpload(ev){
  const file = ev.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const size = 300;
      let w=img.width, h=img.height;
      if(w>h){ h=h*size/w; w=size; } else { w=w*size/h; h=size; }
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      setupLogo = canvas.toDataURL('image/jpeg',0.75);
      document.getElementById('logo-preview').innerHTML = `<img src="${setupLogo}" style="width:64px;height:64px;object-fit:cover;border-radius:50%;">`;
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}
let setupCover = '';
let coverPosX = 50, coverPosY = 50;
function handleCoverUpload(ev){
  const file = ev.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const maxW = 1200;
      let w = img.width, h = img.height;
      if(w > maxW){ h = h*maxW/w; w = maxW; }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      setupCover = canvas.toDataURL('image/jpeg', 0.65);
      coverPosX = 50; coverPosY = 50; // al subir una foto nueva, arrancamos centrada
      renderCoverPreview();
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

async function doSetup(ev){
  ev.preventDefault();
  const btn = ev.target.querySelector('button');
  const setBusy = (busy) => { if(btn){ btn.disabled = busy; btn.textContent = busy ? 'Creando tienda...' : 'Crear mi tienda'; } };

  const fCheck = new FormData(ev.target);
  if(!fCheck.get('businessName') || !fCheck.get('businessName').trim()){ toast('Poné el nombre de tu local.'); return false; }
  if(!fCheck.get('whatsapp') || !fCheck.get('whatsapp').trim()){ toast('Poné tu número de WhatsApp.'); return false; }

  if(!db){
    toast('No se pudo conectar con Firebase. Revisá que pegaste bien los datos de firebaseConfig arriba en el código.');
    return false;
  }

  if(!adminSession){
    const u0 = await googleLogin();
    if(!u0 || !isAdminUser(u0)){ toast('Para crear la tienda entrá con la cuenta de Google del administrador.'); return false; }
    await syncAuth(u0);
  }
  setBusy(true);
  // volvemos a chequear por si otra persona ya configuró la tienda mientras tanto
  const existing = await withTimeout(dbLoad('config'), 8000);
  if(existing === '__timeout__'){
    toast('El guardado está tardando demasiado. Revisá tu conexión a internet e intentá de nuevo.');
    setBusy(false); return false;
  }
  if(existing){ toast('Esta tienda ya fue configurada.'); CONFIG=existing; adminSession=false; navigate('#/'); return false; }

  const f = new FormData(ev.target);
  const newConfig = {
    businessName: f.get('businessName'), whatsapp: f.get('whatsapp'), description: f.get('description')||'',
    logo: setupLogo || document.getElementById('logo-emoji').value || '🏪',
    cover: setupCover || '',
    coverPosition: setupCover ? {x:coverPosX, y:coverPosY} : null,
    createdAt: Date.now()
  };
  const result = await withTimeout(dbSave('config', newConfig), 8000);
  setBusy(false);
  if(result === '__timeout__'){
    toast('El guardado está tardando demasiado. Revisá tu conexión a internet o la configuración de Firebase.');
    return false;
  }
  if(result === false){
    // dbSave ya mostró el motivo del error
    return false;
  }
  CONFIG = newConfig;
  adminSession = true;
  navigate('#/admin/bienvenida');
  return false;
}

function calcAge(birth){
  if(!birth) return null; const b = new Date(birth+'T00:00:00'); if(isNaN(b)) return null;
  const n = new Date(); let a = n.getFullYear()-b.getFullYear();
  if(n.getMonth()<b.getMonth() || (n.getMonth()===b.getMonth() && n.getDate()<b.getDate())) a--;
  return a;
}
function birthdayState(birth){
  if(!birth) return '';
  const b = new Date(birth+'T00:00:00'); if(isNaN(b)) return '';
  const n = new Date();
  if(b.getMonth()===n.getMonth() && b.getDate()===n.getDate()) return 'hoy';
  if(b.getMonth()===n.getMonth()) return 'mes';
  return '';
}

/* ---------------- acceso con Google ---------------- */
let syncCache = {k:undefined, p:null};
function syncAuth(u){
  const k = u ? u.uid : '-';
  if(syncCache.k === k) return syncCache.p;
  syncCache = {k, p: doSyncAuth(u)};
  return syncCache.p;
}
async function doSyncAuth(u){
  AUTH_USER = u || null;
  adminSession = isAdminUser(u);
  if(adminSession){ await loadAdminData(); return; }
  stopOrdersListener(); VIEWS = {}; CLICKS = []; ORDERS = {}; LEGACY_ORDERS = {};
  if(u){
    const c = await dbGetCustomer(u.uid);
    if(c) setCustomer(publicCustomer(c)); else if(c===null) setCustomer(null);
  } else { setCustomer(null); }
}
async function loadAdminData(){
  VIEWS = (await dbLoad('views')) || {};
  const ck = (await dbLoad('clicks')) || {};
  if(Array.isArray(ck)){
    const m = {}; ck.forEach(x=>{ m[secureId('c')] = x; });
    CLICKS = ck.slice();
    if(ck.length) await dbSave('clicks', m);
  } else { CLICKS = Object.values(ck); }
  LEGACY_ORDERS = (await dbLoad('orders')) || {};
  if(CONFIG && CONFIG.adminToken){
    const c2 = {...CONFIG}; delete c2.adminToken;
    const r = await dbSave('config', c2); if(r!==false) CONFIG = c2;
  }
  startOrdersListener();
}
async function googleLogin(){
  if(!auth){ toast('El acceso con Google no está disponible en este momento.'); return null; }
  const provider = new firebase.auth.GoogleAuthProvider();
  try{ provider.setCustomParameters({prompt:'select_account'}); }catch(e){}
  try{
    const r = await auth.signInWithPopup(provider);
    return r.user;
  }catch(e){
    const code = e && e.code;
    if(code==='auth/popup-closed-by-user' || code==='auth/cancelled-popup-request') return null;
    if(code==='auth/popup-blocked'){ try{ await auth.signInWithRedirect(provider); }catch(e2){ console.error(e2); } return null; }
    if(code==='auth/unauthorized-domain') toast('Falta autorizar este dominio en Firebase (Authentication → Configuración → Dominios autorizados).');
    else if(code==='auth/operation-not-allowed') toast('Falta activar Google en Firebase (Authentication → Método de acceso).');
    else toast('No se pudo entrar con Google. Intentá de nuevo.');
    console.error(e);
    return null;
  }
}

function initAuth(){
  return new Promise(res=>{
    if(!auth){ res(); return; }
    let first = true;
    const fin = ()=>{ if(first){ first = false; res(); } };
    setTimeout(fin, 6000);
    auth.onAuthStateChanged(async u=>{
      const before = syncCache.k;
      try{ await syncAuth(u); }catch(e){ console.error(e); }
      if(first){ fin(); } else if(before !== syncCache.k){ render(); }
    });
  });
}

function regGetLocation(){
  const st = document.getElementById('reg-loc-status');
  if(!navigator.geolocation){ toast('Tu navegador no permite obtener la ubicación. Escribí tu dirección.'); return; }
  if(st) st.textContent = 'Buscando tu ubicación...';
  navigator.geolocation.getCurrentPosition(pos=>{
    window.__regLoc = {lat: +pos.coords.latitude.toFixed(6), lng: +pos.coords.longitude.toFixed(6)};
    if(st) st.innerHTML = '✅ Ubicación guardada. <a href="'+customerMapsUrl(window.__regLoc)+'" target="_blank" rel="noopener">Ver en el mapa</a>';
  }, ()=>{
    if(st) st.textContent = 'No pudimos obtener tu ubicación. Permití el acceso o escribí tu dirección.';
  }, {enableHighAccuracy:true, timeout:15000, maximumAge:60000});
}
async function submitRegistro(btn){
  if(!AUTH_USER || adminSession){ toast('Primero entrá con Google.'); return; }
  const f = new FormData(document.getElementById('reg-form'));
  const name = (f.get('name')||'').trim(), phone = (f.get('phone')||'').trim();
  const birth = (f.get('birth')||'').trim(), address = (f.get('address')||'').trim();
  const digits = normPhone(phone);
  if(!name){ toast('Poné tu nombre.'); return; }
  if(digits.length < 8){ toast('Poné un número de teléfono válido.'); return; }
  if(!birth || isNaN(new Date(birth+'T00:00:00')) || new Date(birth) > new Date()){ toast('Poné tu fecha de nacimiento.'); return; }
  if(!window.__regLoc && !address){ toast('Poné tu ubicación o tu dirección.'); return; }
  if(!f.get('consent')){ toast('Tenés que aceptar que guardemos tus datos.'); return; }
  if(btn){ btn.disabled = true; }
  try{
    const prev = getCustomer() || {};
    const uid = AUTH_USER.uid;
    const c = { id: uid, uid, email: AUTH_USER.email || '', name, phone: digits, birth, address,
      lat: window.__regLoc ? window.__regLoc.lat : null, lng: window.__regLoc ? window.__regLoc.lng : null,
      createdAt: prev.createdAt || Date.now(), updatedAt: Date.now() };
    const ok = await withTimeout(dbSaveCustomer(c), 10000);
    if(ok === false) return;
    if(ok === '__timeout__'){ toast('Está tardando demasiado. Revisá tu conexión e intentá de nuevo.'); return; }
    setCustomer(publicCustomer(c));
    toast(prev.id ? 'Datos guardados.' : '¡Listo, ya estás registrado!');
    navigate('#/');
  } finally { if(btn){ btn.disabled = false; } }
}

  const toMin = x=>{ const p=String(x||'0:0').split(':'); return (Number(p[0])||0)*60+(Number(p[1])||0); };
  const d = new Date(); const now = d.getHours()*60+d.getMinutes();

/* ---------------- sabores (helados por tamaño, un grupo de sabores por cada pote) ---------------- */
window.__pdPots = [{}];     // un mapa {sabor: cantidad} por cada pote
window.__pdPotIdx = 0;      // pote que se está eligiendo ahora
window.__flOpen = false;
function resetFlavors(){ window.__pdPots = [{}]; window.__pdPotIdx = 0; }
function flavorList(){ return (CONFIG.flavors||[]).filter(f=>f && f.name); }
function potTotal(i){ return Object.values(window.__pdPots[i]||{}).reduce((a,b)=>a+b,0); }
function potLabel(i){
  return Object.entries(window.__pdPots[i]||{}).filter(e=>e[1]>0).map(e=>e[0]+(e[1]>1?' ×'+e[1]:'')).join(', ');
}
function potsDone(){ let n=0; for(let i=0;i<window.__pdPots.length;i++) if(potTotal(i)>0) n++; return n; }
function syncPots(qty){
  qty = Math.max(1, Number(qty)||1);
  while(window.__pdPots.length < qty) window.__pdPots.push({});
  if(window.__pdPots.length > qty) window.__pdPots.length = qty;
  if(window.__pdPotIdx >= qty) window.__pdPotIdx = qty-1;
}
function variantMax(p){
  const v = (p.variants||[]).find(x=>x.name===window.__pdVariant);
  return v ? (Number(v.maxFlavors)||0) : 0;
}
function openFlavors(idx){
  if(typeof idx === 'number') window.__pdPotIdx = idx;
  window.__flOpen = true; flavorRenderSheet();
}
function closeFlavors(){ window.__flOpen = false; const o=document.getElementById('fl-overlay'); if(o) o.remove(); render(); }
function flavorGoPot(i){ window.__pdPotIdx = i; flavorRenderSheet(); }
function flavorNext(){
  const n = window.__pdPots.length;
  if(window.__pdPotIdx < n-1){ window.__pdPotIdx++; flavorRenderSheet(); const l=document.getElementById('fl-list'); if(l) l.scrollTop=0; }
  else closeFlavors();
}
function flavorCopyAll(){
  const src = {...(window.__pdPots[window.__pdPotIdx]||{})};
  window.__pdPots = window.__pdPots.map(()=>({...src}));
  flavorRenderSheet();
}
function flavorChange(i, d){
  const list = flavorList(); const fl = list[i]; if(!fl) return;
  const p = PRODUCTS[(parseHash().parts[1])]; if(!p) return;
  const max = variantMax(p); const pi = window.__pdPotIdx;
  const pot = window.__pdPots[pi]; if(!pot) return;
  const cur = pot[fl.name]||0; const next = cur + d;
  if(next<0) return;
  if(d>0 && (potTotal(pi)>=max || fl.available===false)) return;
  if(next===0) delete pot[fl.name]; else pot[fl.name]=next;
  flavorRenderSheet();
}
function flavorRenderSheet(){
  const p = PRODUCTS[(parseHash().parts[1])]; if(!p) return;
  const max = variantMax(p); const list = flavorList();
  const pi = window.__pdPotIdx; const pots = window.__pdPots; const n = pots.length;
  const total = potTotal(pi); const pot = pots[pi]||{};
  let o = document.getElementById('fl-overlay');
  const prevScroll = (document.getElementById('fl-list')||{}).scrollTop || 0;
  const last = pi >= n-1;
  const html = `<div class="fl-sheet" onclick="event.stopPropagation()">
      <div class="fl-head"><h3>🍨 ${n>1 ? 'Sabores del pote '+(pi+1)+' de '+n : 'Elegí tus sabores'}</h3><span class="fl-count">${total}/${max}</span></div>
      ${n>1 ? `<div class="fl-tabs">${pots.map((x,i)=>`<button type="button" class="fl-tab ${i===pi?'on':''} ${potTotal(i)>0?'ok':''}" onclick="flavorGoPot(${i})">${potTotal(i)>0?'✓ ':''}Pote ${i+1}</button>`).join('')}</div>` : ''}
      <p class="hint" style="margin:0;">Hasta ${max} sabores por pote. Podés repetir el mismo.</p>
      <div class="fl-list" id="fl-list">
        ${list.length ? list.map((fl,i)=>{ const c = pot[fl.name]||0; const na = fl.available===false;
          return `<div class="fl-row ${c?'sel':''} ${na?'na':''}">
            <span class="fl-name">${escapeHtml(fl.name)}${na?' <small>(agotado)</small>':''}</span>
            <span class="fl-step"><button type="button" ${c<=0?'disabled':''} onclick="flavorChange(${i},-1)">−</button><span>${c}</span><button type="button" ${(na||total>=max)?'disabled':''} onclick="flavorChange(${i},1)">+</button></span>
          </div>`; }).join('') : '<p class="hint">Todavía no hay sabores cargados.</p>'}
      </div>
      ${(n>1 && total>0) ? `<button type="button" class="btn btn-outline btn-block" style="margin-bottom:8px;" onclick="flavorCopyAll()">📋 Usar estos mismos sabores en los ${n} potes</button>` : ''}
      <button type="button" class="btn btn-mango btn-block" ${(!last && total<=0)?'disabled':''} onclick="flavorNext()">${ last ? (potsDone()>0 ? 'Listo ('+potsDone()+' de '+n+' potes con sabores)' : 'Cerrar') : 'Siguiente pote ›' }</button>
    </div>`;
  if(!o){ o = document.createElement('div'); o.id='fl-overlay'; o.className='fl-overlay'; o.onclick = closeFlavors; document.body.appendChild(o); }
  o.innerHTML = html;
  const l = document.getElementById('fl-list'); if(l) l.scrollTop = prevScroll;
}
function addProductToCart(id){
  const p = PRODUCTS[id]; if(!p) return;
  if(!cartOn(p)){ toast('Este producto se consulta por WhatsApp.'); return; }
  const base = window.__pdVariant || '';
  const max = variantMax(p);
  if(max<=0){ addToCart(id, window.__pdQty, base || null); return; }
  const n = window.__pdPots.length;
  for(let i=0;i<n;i++){ if(potTotal(i)<=0){ openFlavors(i); return; } }
  const cart = getCart();
  for(let i=0;i<n;i++){
    const vn = base + ' · ' + potLabel(i);
    const key = lineKey(id, vn);
    const ex = cart.find(x=>lineKey(x.productId, x.variantName)===key);
    if(ex) ex.qty += 1; else cart.push({productId:id, qty:1, variantName:vn});
  }
  saveCart(cart);
  window.__pdQty = 1; resetFlavors();
  toast(n>1 ? n+' potes agregados al carrito.' : 'Agregado al carrito.');
  render();
}
function galSwipe(e, n){
  if(window.__gx==null) return;
  const dx = e.changedTouches[0].clientX - window.__gx; window.__gx = null;
  if(Math.abs(dx) < 40) return;
  const cur = window.__pdIdx || 0;
  window.__pdIdx = ((cur + (dx<0 ? 1 : -1)) % n + n) % n;
  render();
}
function viewProducto(id){
  const p = PRODUCTS[id];
  if(!p){ return `${renderHeader()}<div class="container section">${emptyState('❌','Este producto no existe o fue eliminado.')}</div>${renderFooter()}`; }
  const images = (p.images && p.images.length) ? p.images : [PLACEHOLDER_IMG];
  const idx = window.__pdIdx || 0;
  const discount = p.oldPrice ? Math.round(100-(p.price/p.oldPrice*100)) : 0;
  const disabled = p.status==='agotado';
  window.__pdQty = window.__pdQty || 1;
  const hasVariants = p.variants && p.variants.length>0;
  if(hasVariants && !window.__pdVariant) window.__pdVariant = p.variants[0].name;
  const selectedVariant = hasVariants ? p.variants.find(v=>v.name===window.__pdVariant) || p.variants[0] : null;
  const needFlavors = !!(selectedVariant && Number(selectedVariant.maxFlavors)>0);
  if(needFlavors) syncPots(window.__pdQty);
  const finalPrice = p.price + (selectedVariant ? Number(selectedVariant.priceDelta)||0 : 0);
  const msg = isService(p) ? `Hola, me interesa el servicio "${p.name}" que vi en el catálogo de ${CONFIG.businessName}. ¿Me pasás más información?` : `Hola, vi ${p.name}${selectedVariant?(' ('+selectedVariant.name+')'):''} en el catálogo de ${CONFIG.businessName} y quiero consultar.`;
  return `
  <div class="pd-flexpage">
    ${renderHeader()}
    <div class="pd-flexcontent">
      <div class="pd-flex-gallery ${isService(p)?'':'pano'}" ${images.length>1?`ontouchstart="window.__gx=event.touches[0].clientX" ontouchend="galSwipe(event, ${images.length})"`:''}><img src="${images[idx]||images[0]}" alt="${escapeHtml(p.name)}"></div>
      ${images.length>1?`<div class="pd-thumbs" style="padding:0 18px; margin:4px 0 2px; flex:0 0 auto;">${images.map((im,i)=>`<img src="${im}" class="${i===idx?'active':''}" onclick="window.__pdIdx=${i}; render()" style="width:32px;height:32px;">`).join('')}</div>`:''}
      <div class="pd-fixed-info">
        <h1 class="pd-title" style="font-size:16px; margin:4px 0 2px;">${escapeHtml(p.name)}</h1>
        ${hasPrice(p) ? `<div class="pd-price" style="font-size:17px;">${money(finalPrice)} ${(!hasVariants && p.oldPrice)?`<span class="price-old" style="font-size:12px; margin-left:5px;">${money(p.oldPrice)}</span> <span class="discount-badge">-${discount}%</span>`:''}</div>` : ''}
        <div style="margin-top:4px;">
          <span class="tag" style="font-size:10.5px; padding:3px 7px; margin:0 4px 4px 0;">${catInfo(p.category).icon} ${catInfo(p.category).name}</span>
          ${isService(p) ? `<span class="tag" style="font-size:10.5px; padding:3px 7px; margin:0 4px 4px 0;">📣 Servicio</span>` : `<span class="tag" style="font-size:10.5px; padding:3px 7px; margin:0 4px 4px 0;">${p.status==='agotado'?'❌ '+t('Sin stock'):(p.status==='pausado'?'⏸️ No visible':'✅ '+t('Disponible'))}</span>`}
          ${isLowStock(p) ? `<span class="tag" style="font-size:10.5px; padding:3px 7px; margin:0 4px 4px 0; background:var(--coral-tint); color:#8A2A1C;">🔥 ¡Últimas ${p.stock}!</span>` : ''}
        </div>
        ${p.description ? `<div class="pd-desc-clamp">${escapeHtml(p.description)}</div>` : ''}
        ${hasVariants ? `
        <div class="pill-select" style="margin:6px 0;">
          ${p.variants.map(v=>`<div class="pill-opt ${v.name===window.__pdVariant?'sel':''}" style="font-size:11.5px; padding:6px 11px;" onclick="window.__pdVariant='${escapeHtml(v.name).replace(/'/g,"\\'")}'; resetFlavors(); render();">${escapeHtml(v.name)} · ${money(p.price+(Number(v.priceDelta)||0))}</div>`).join('')}
        </div>` : ''}
        ${(cartOn(p) && !disabled && needFlavors) ? `
        <button type="button" class="fl-pick" onclick="openFlavors(${(()=>{ const k=window.__pdPots.findIndex((x,i)=>potTotal(i)<=0); return k<0?0:k; })()})"><span>🍨 ${potsDone()? 'Sabores elegidos' : 'Elegir sabores'}<small>${potsDone()? escapeHtml(window.__pdPots.length>1 ? (potsDone()+' de '+window.__pdPots.length+' potes con sabores') : potLabel(0)) : (window.__pdPots.length>1 ? 'Uno por cada pote · hasta '+selectedVariant.maxFlavors+' sabores' : 'Hasta '+selectedVariant.maxFlavors+' sabores')}</small></span><span style="color:var(--teal-dark,#0f6b63);">${potsDone()}/${window.__pdPots.length} ›</span></button>` : ''}

          <span style="font-weight:700; font-size:12px;">${t('Cantidad:')}</span>

function getOrderTotals(){
  const subtotal = cartSubtotal();
  const zones = (CONFIG.deliveryZones||[]);
  const zone = window.__cartZoneIndex!=null ? zones[window.__cartZoneIndex] : null;
  const zonePrice = zone ? Number(zone.price)||0 : 0;
  const coupon = window.__cartCoupon || null;
  const discount = coupon ? Math.round(subtotal * (Number(coupon.percent)||0) / 100) : 0;
  const total = Math.max(0, subtotal + zonePrice - discount);
  return {subtotal, zone, zonePrice, coupon, discount, total};
}

function applyCoupon(){
  const code = (document.getElementById('coupon-input').value||'').trim().toUpperCase();
  window.__cartCouponError = '';
  if(!code){ window.__cartCoupon = null; render(); return; }
  const found = (CONFIG.coupons||[]).find(c=>c.code.toUpperCase()===code);
  if(!found){ window.__cartCoupon = null; window.__cartCouponError = 'Ese cupón no existe o venció.'; render(); return; }
  window.__cartCoupon = found;
  toast('¡Cupón aplicado!');
  render();
}
async function submitCheckout(btn){
  const items = cartLineItems();
  if(!items.length){ toast('Tu carrito está vacío.'); return; }
  const f = new FormData(document.getElementById('checkout-form'));
  const customerName = (f.get('customerName')||'').trim();
  const customerPhone = normPhone((f.get('customerPhone')||'').trim());
  const notes = (f.get('notes')||'').trim();
  const deliveryTime = (f.get('deliveryTime')||'').trim();
  if(!customerName){ toast('Poné tu nombre.'); return; }
  if(!customerPhone){ toast('Poné tu WhatsApp.'); return; }

  if(btn){ btn.disabled = true; btn.textContent = 'Enviando...'; }

  const t = getOrderTotals();
  const id = secureId('ord');
  const order = {
    id, customerName, customerPhone, notes, deliveryTime,
    customerId: ((AUTH_USER && !adminSession) ? AUTH_USER.uid : ''), customerAddress: (getCustomer()||{}).address || '', customerMapsUrl: customerMapsUrl(getCustomer()),
    items: items.map(it=>({productId:it.productId, name:it.name, variantName:it.variantName||'', price:it.price, qty:it.qty, available:true, note:''})),
    subtotal: t.subtotal,
    zoneName: t.zone ? t.zone.name : '', zonePrice: t.zonePrice,
    couponCode: t.coupon ? t.coupon.code : '', discount: t.discount,
    total: t.total,
    status: 'nuevo',
    createdAt: Date.now(), updatedAt: Date.now()
  };
  const updatedOrders = {...ORDERS, [id]: order};
  const result = await withTimeout(dbMergeOrder(order), 10000);
  if(result === '__timeout__' || result === false){
    toast('No se pudo enviar el pedido. Probá de nuevo.');
    if(btn){ btn.disabled=false; btn.textContent='✅ Confirmar pedido'; }
    return;
  }
  ORDERS = updatedOrders;

  clearCart();
  window.__cartZoneIndex = null; window.__cartCoupon = null; window.__cartCouponError = '';
  window.__justOrdered = id;
  navigate('#/pedido/'+id);
}

async function deleteProduct(id){
  if(!confirm('¿Eliminar este producto?')) return;
  const hadImgDoc = PRODUCTS[id] && PRODUCTS[id].imgDoc;
  delete PRODUCTS[id];
  await dbSave('products', productsForSave(PRODUCTS));
  if(hadImgDoc){ try{ await db.collection(FIRESTORE_COLLECTION).doc('pimg_'+id).delete(); }catch(e){} }
  toast('Producto eliminado.'); render();
}

async function importLegacyOrders(btn){
  const list = Object.values(LEGACY_ORDERS||{}).filter(o=>o && o.id);
  if(!list.length) return;
  if(btn) btn.disabled = true;
  try{
    for(const o of list){ await db.collection(FIRESTORE_COLLECTION).doc('order_'+o.id).set({data:o}); }
    await db.collection(FIRESTORE_COLLECTION).doc('orders').delete();
    LEGACY_ORDERS = {}; toast('Pedidos importados: ' + list.length);
    render();
  }catch(e){ console.error(e); toast('No se pudo importar: ' + (e && e.message ? e.message : 'error')); }
  finally{ if(btn) btn.disabled = false; }
}
function exportOrdersCSV(){
  const orders = Object.values(ORDERS).sort((a,b)=>b.createdAt-a.createdAt);
  const rows = [['Fecha','Cliente','WhatsApp','Productos','Subtotal','Envio','Cupon','Descuento','Total','Estado','N° pedido']];
  orders.forEach(o=>{
    const itemsStr = o.items.map(it=>`${it.qty}x ${it.name}${it.variantName?(' ('+it.variantName+')'):''}`).join(' | ');
    rows.push([
      new Date(o.createdAt).toLocaleString('es-PY'), o.customerName, o.customerPhone, itemsStr,
      o.subtotal??o.total, o.zonePrice||0, o.couponCode||'', o.discount||0, o.total, o.status, o.id
    ]);
  });
  const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'pedidos_'+CONFIG.businessName.replace(/\s+/g,'_')+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

async function submitTienda(ev){
  ev.preventDefault();
  const btn = ev.target.querySelector('button');
  const setBusy = (busy) => { if(btn){ btn.disabled = busy; btn.textContent = busy ? 'Guardando...' : 'Guardar cambios'; } };
  const f = new FormData(ev.target);
  if(!f.get('businessName') || !f.get('businessName').trim()){ toast('Poné el nombre de tu local.'); return false; }
  if(!f.get('whatsapp') || !f.get('whatsapp').trim()){ toast('Poné tu número de WhatsApp.'); return false; }
  const updated = {...CONFIG};
  updated.businessName = f.get('businessName');
  updated.whatsapp = f.get('whatsapp');
  updated.description = f.get('description');
  updated.tagline = (f.get('tagline')||'').trim();
  { let m=(f.get('mapsLink')||'').trim(); if(m && !/^https?:\/\//i.test(m)) m='https://'+m; updated.mapsLink = m; }
  updated.openMode = f.get('openMode')||'hidden';
  updated.hours = {from: f.get('hoursFrom')||'09:00', to: f.get('hoursTo')||'21:00'};
  updated.lowStockThreshold = Math.max(1, Number(f.get('lowStockThreshold'))||3);
  const emoji = document.getElementById('logo-emoji').value.trim();
  if(setupLogo){ updated.logo = setupLogo; }
  else if(emoji){ updated.logo = emoji; }
  if(setupCover){ updated.cover = setupCover; }
  if(updated.cover){ updated.coverPosition = {x: coverPosX, y: coverPosY}; }

  setBusy(true);
  const result = await withTimeout(dbSave('config', updated), 8000);
  setBusy(false);
  if(result === '__timeout__'){ toast('El guardado está tardando demasiado. Revisá tu conexión a internet e intentá de nuevo.'); return false; }
  if(result === false) return false; // dbSave ya avisó el motivo
  setupLogo = '';
  setupCover = '';
  CONFIG = updated;
  toast('¡Tienda actualizada!');
  navigate('#/admin');
  return false;
}

          <input type="checkbox" id="cart-enabled" name="cartEnabled" style="width:20px; height:20px;" ${(editing ? editing.cartEnabled!==false : true) ? 'checked' : ''}>
          <label for="cart-enabled" style="margin:0;">Permitir "Agregar al carrito" (si lo quitás, solo se consulta por WhatsApp)</label>
        </div>
        <div class="form-row"><label>WhatsApp para consultas de esta publicación (opcional)</label>
          <input class="field" name="waPhone" type="tel" placeholder="Si lo dejás vacío, se usa el de la tienda" value="${escapeHtml(editing?.waPhone||'')}">
        </div>
        <div class="two-col">
          <div class="form-row"><label>Precio (₲) <span class="hint">(en servicios puede quedar vacío)</span></label><input class="field" type="number" name="price" value="${editing?.price||''}"></div>
          <div class="form-row"><label>Precio anterior (opcional)</label><input class="field" type="number" name="oldPrice" value="${editing?.oldPrice||''}"></div>
        </div>
        <div class="form-row"><label>Descripción</label><textarea class="field" name="description">${escapeHtml(editing?.description||'')}</textarea></div>
        <div class="form-row"><label>Categoría</label>
          <select class="field" name="category">
            ${CATEGORIES.map(c=>`<option value="${c.slug}" ${editing?.category===c.slug?'selected':''}>${c.icon} ${c.name}</option>`).join('')}
          </select>
        </div>
        <div class="two-col">
          <div class="form-row" id="stock-row"><label>Stock</label><input class="field" type="number" name="stock" value="${editing?.stock ?? 1}"></div>
          <div class="form-row"><label>Estado</label>
            <select class="field" name="status">
              <option value="activo" ${editing?.status==='activo'?'selected':''}>Activo</option>
              <option value="pausado" ${editing?.status==='pausado'?'selected':''}>Pausado (oculto)</option>
              <option value="agotado" ${editing?.status==='agotado'?'selected':''}>Agotado</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <label>Variantes (opcional, ej: tamaños o sabores)</label>
          <p class="hint" style="margin-bottom:8px;">Si cargás variantes, el cliente va a tener que elegir una antes de agregar al carrito. "Máx. sabores": para helados, cuántos sabores puede elegir en ese tamaño (0 = no pide sabores; los sabores se cargan en el panel, en "🍨 Sabores"). El precio de arriba es el precio base y NO aparece como opción: si querés que el cliente pueda elegirlo, cargalo también como variante con ajuste 0 (ej: "1/4 kilo", 0).</p>
          <div id="variants-list">${renderVariantRows()}</div>
          <button type="button" class="btn btn-outline btn-sm" style="margin-top:6px;" onclick="addVariantRow()">+ Agregar variante</button>
        </div>
        <button type="button" class="btn btn-outline btn-block" onclick="showProductPreview()">👁️ Vista previa</button>
        <div id="preview-slot"></div>
        <button type="button" class="btn btn-mango btn-block" style="margin-top:10px;" onclick="submitProduct(fakeEvent(this.closest('form')), ${editing?`'${editId}'`:'null'})">${editing?'Guardar cambios':'Publicar producto'}</button>
      </form>
    </div>
  </div>
  ${renderFooter()}`;
}
function showProductPreview(){
  const f = new FormData(document.getElementById('product-form'));
  const temp = {
    id:'preview',
    name: f.get('name') || 'Nombre del producto',
    price: Number(f.get('price'))||0,
    oldPrice: f.get('oldPrice') ? Number(f.get('oldPrice')) : null,
    description: f.get('description')||'',
    category: f.get('category'),
    kind: f.get('kind')||'producto', cartEnabled: !!f.get('cartEnabled'),
    status: f.get('status')||'activo',
    images: productFormImages.length ? productFormImages : [PLACEHOLDER_IMG]
  };
  const discount = temp.oldPrice ? Math.round(100-(temp.price/temp.oldPrice*100)) : 0;
  document.getElementById('preview-slot').innerHTML = `
    <div style="margin:14px 0; padding-top:14px; border-top:1px dashed var(--line);">
      <p class="hint" style="margin-bottom:10px;">Así se va a ver en tu catálogo y al abrirlo:</p>
      <div style="max-width:200px; margin:0 auto 16px;">${productCard(temp)}</div>
      <div style="max-width:360px; margin:0 auto;">
        <div class="pd-gallery" style="aspect-ratio:4/3;"><img src="${temp.images[0]}" alt=""></div>
        <h1 class="pd-title" style="font-size:19px; margin-top:12px;">${escapeHtml(temp.name)}</h1>
        <div class="pd-price" style="font-size:20px;">${hasPrice(temp) ? money(temp.price) : 'Consultar'} ${temp.oldPrice?`<span class="price-old" style="font-size:13px;">${money(temp.oldPrice)}</span> <span class="discount-badge">-${discount}%</span>`:''}</div>
        <div style="margin-top:8px;"><span class="tag">${catInfo(temp.category).icon} ${catInfo(temp.category).name}</span></div>
        <div class="pd-desc" style="font-size:13.5px;">${escapeHtml(temp.description)||'<em>Sin descripción</em>'}</div>
      </div>
    </div>
  `;
}
const MAX_PROD_IMAGES = 8;
function handleImageUpload(ev){
  // Las fotos se achican a 600px y se comprimen para que entren varias por producto.
  const room = MAX_PROD_IMAGES - productFormImages.length;
  const all = Array.from(ev.target.files);
  if(all.length > room) toast('Máximo ' + MAX_PROD_IMAGES + ' fotos por producto.');
  const files = all.slice(0, Math.max(0, room));
  files.forEach(file=>{
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const isSrv = ((document.querySelector('#product-form [name=kind]')||{}).value==='servicio'); const maxDim = isSrv ? 1100 : 600; let w=img.width,h=img.height;
        if(w>h && w>maxDim){ h=h*maxDim/w; w=maxDim; } else if(h>maxDim){ w=w*maxDim/h; h=maxDim; }
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        if(productFormImages.length < MAX_PROD_IMAGES){ productFormImages.push(canvas.toDataURL('image/jpeg', isSrv ? 0.72 : 0.6)); refreshImgPreview(); }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
  ev.target.value = '';
}
function onKindChange(k){
  const cb = document.getElementById('cart-enabled'); if(cb) cb.checked = (k!=='servicio');
  const sr = document.getElementById('stock-row'); if(sr) sr.style.display = (k==='servicio') ? 'none' : '';
}
function addImgUrl(){
  const input = document.getElementById('img-url-input');
  if(productFormImages.length >= MAX_PROD_IMAGES){ toast('Máximo ' + MAX_PROD_IMAGES + ' fotos por producto.'); return; }
  if(input.value.trim()){ productFormImages.push(input.value.trim()); input.value=''; refreshImgPreview(); }
}
function removeProdImg(i){ productFormImages.splice(i,1); refreshImgPreview(); }
function refreshImgPreview(){
  const el = document.getElementById('img-preview');
  if(el) el.innerHTML = productFormImages.map((im,i)=>`<div class="thumb"><img src="${im}"><button type="button" onclick="removeProdImg(${i})">✕</button></div>`).join('');
}
function renderVariantRows(){
  if(!productFormVariants.length) return `<p class="hint">Sin variantes cargadas.</p>`;
  return productFormVariants.map((v,i)=>`
    <div class="two-col" style="margin-bottom:8px; align-items:end;">
      <div><label class="hint" style="display:block; margin-bottom:4px;">Nombre</label>
        <input class="field" value="${escapeHtml(v.name)}" oninput="productFormVariants[${i}].name=this.value">
      </div>
      <div style="display:flex; gap:6px; align-items:end;">
        <div style="flex:1;"><label class="hint" style="display:block; margin-bottom:4px;">Ajuste de precio (± ₲)</label>
          <input class="field" type="number" value="${v.priceDelta||0}" oninput="productFormVariants[${i}].priceDelta=Number(this.value)||0">
        </div>
        <div style="flex:0 0 78px;"><label class="hint" style="display:block; margin-bottom:4px;">Máx. sabores</label>
          <input class="field" type="number" min="0" max="20" value="${v.maxFlavors||0}" oninput="productFormVariants[${i}].maxFlavors=Math.max(0,Number(this.value)||0)">
        </div>
        <button type="button" class="btn btn-danger btn-sm" onclick="removeVariantRow(${i})">✕</button>
      </div>
    </div>
  `).join('');
}
function addVariantRow(){
  productFormVariants.push({name:'', priceDelta:0, maxFlavors:0});
  document.getElementById('variants-list').innerHTML = renderVariantRows();
}
function removeVariantRow(i){
  productFormVariants.splice(i,1);
  document.getElementById('variants-list').innerHTML = renderVariantRows();
}
async function submitProduct(ev, editId){
  ev.preventDefault();
  const btn = ev.target.querySelector('button');
  const setBusy = (busy) => { if(btn){ btn.disabled = busy; btn.textContent = busy ? 'Guardando...' : (editId?'Guardar cambios':'Publicar producto'); } };
  const f = new FormData(ev.target);
  if(!f.get('name') || !f.get('name').trim()){ toast('Poné el nombre del producto.'); return false; }
  const isSrv = f.get('kind')==='servicio';
  const wantsCart = !!f.get('cartEnabled');
  if(!isSrv && (!f.get('price') || Number(f.get('price'))<=0)){ toast('Poné un precio válido.'); return false; }
  if(isSrv && wantsCart && (!f.get('price') || Number(f.get('price'))<=0) && !productFormVariants.some(v=>v.name && v.name.trim())){ toast('Para poder agregarlo al carrito poné un precio (o desmarcá "Permitir agregar al carrito").'); return false; }
  if(!isSrv && (f.get('stock')==='' || f.get('stock')==null)){ toast('Poné el stock disponible.'); return false; }
  const id = editId || uid('p');
  const existing = editId ? PRODUCTS[editId] : null;
  const updatedProducts = {...PRODUCTS};
  const imagesFinal = productFormImages.length?productFormImages:[PLACEHOLDER_IMG];
  updatedProducts[id] = {
    id, name:f.get('name'), kind: isSrv?'servicio':'producto', cartEnabled: wantsCart, waPhone: (f.get('waPhone')||'').trim(), price:Number(f.get('price'))||0, oldPrice: f.get('oldPrice')?Number(f.get('oldPrice')):null,
    description:f.get('description')||'', category:f.get('category'), stock: isSrv ? 999 : Number(f.get('stock')), status:f.get('status'),
    images: imagesFinal, imgDoc: true,
    variants: productFormVariants.filter(v=>v.name && v.name.trim()),
    createdAt: existing ? existing.createdAt : Date.now()
  };

  setBusy(true);
  const imgChars = imagesFinal.reduce((a,x)=>a+x.length,0);
  if(imgChars > 900000){ setBusy(false); toast('Las fotos pesan demasiado juntas. Sacá alguna o usá fotos más simples.'); return false; }
  const imgSaved = await withTimeout(dbSave('pimg_'+id, imagesFinal), 15000);
  if(imgSaved === '__timeout__' || imgSaved === false){ setBusy(false); if(imgSaved==='__timeout__') toast('El guardado de fotos está tardando demasiado. Revisá tu conexión.'); return false; }
  const result = await withTimeout(dbSave('products', productsForSave(updatedProducts)), 8000);
  setBusy(false);
  if(result === '__timeout__'){ toast('El guardado está tardando demasiado. Revisá tu conexión a internet e intentá de nuevo.'); return false; }
  if(result === false) return false; // dbSave ya avisó el motivo
  PRODUCTS = updatedProducts;
  toast(editId?'Producto actualizado.':'¡Producto publicado!');
  productFormImages = [];
  productFormVariants = [];
  navigate('#/admin');
  return false;
}

/* =========================================================================
   RENDER PRINCIPAL / RUTAS
   ========================================================================= */
function render(){
  checkAdminFromUrl();
  stopBanner();
  const {parts, query} = parseHash();
  const root = document.getElementById('app');
  let html = '';

  if(!CONFIG){ html = viewSetup(); root.innerHTML = html; return; }

  if(parts[0]==='admin') previewMode = false; // salir de la vista previa al entrar a cualquier pantalla de administración

  document.body.classList.toggle('no-scroll-page', parts[0]==='producto' && !!parts[1]);

  if(parts[0]==='producto' && parts[1]){
    if(window.__lastView!==parts[1]){ trackView(parts[1]); window.__lastView=parts[1]; window.__pdIdx=0; window.__pdQty=1; window.__pdVariant=null; resetFlavors(); }
    html = viewProducto(parts[1]);
  }
  else if(parts[0]==='registro'){ html = viewRegistro(); }
  else if(parts[0]==='carrito'){ html = viewCarrito(); }
  else if(parts[0]==='pedido' && parts[1]){ html = viewPedido(parts[1]); }
  else if(parts[0]==='admin' && !parts[1]){ html = adminSession ? viewAdmin() : viewAdminGate(); }
  else if(parts[0]==='admin' && parts[1]==='bienvenida'){ html = adminSession ? viewBienvenida() : viewAdminGate(); }
  else if(parts[0]==='admin' && parts[1]==='publicar'){ html = viewAdminPublicar(null); }
  else if(parts[0]==='admin' && parts[1]==='producto' && parts[3]==='editar'){ html = viewAdminPublicar(parts[2]); }
  else if(parts[0]==='admin' && parts[1]==='tienda'){ html = viewAdminTienda(); }
  else if(parts[0]==='admin' && parts[1]==='pedidos'){ html = viewAdminPedidos(); }
  else if(parts[0]==='admin' && parts[1]==='pedido' && parts[2]){ html = viewAdminPedidoDetalle(parts[2]); }
  else if(parts[0]==='admin' && parts[1]==='configuracion'){ html = viewAdminConfiguracion(); }
  else if(parts[0]==='admin' && parts[1]==='banners'){ html = viewAdminBanners(); }
  else if(parts[0]==='admin' && parts[1]==='sabores'){ html = viewAdminSabores(); }
  else if(parts[0]==='admin' && parts[1]==='clientes'){ html = viewAdminClientes(); }
  else { html = viewCatalogo(query); }

  root.innerHTML = renderPreviewBanner() + html;
  if(parts[0]==='admin' && parts[1]==='tienda'){ initCoverPreview(); }
  if(parts[0]==='admin' && parts[1]==='bienvenida'){ renderQrCode(); }
  if(parts[0]==='admin' && parts[1]==='sabores' && flavorsForm){ flvRender(); }
  if(parts[0]==='admin' && parts[1]==='clientes' && adminSession){ loadCustomersAdmin(); }
  if(parts[0]==='admin' && parts[1]==='banners' && bnForm){ bnRefreshAll(); }
  else if(document.getElementById('bn')){ setupBannerOnPage(BANNERS.items, BANNERS.effect, BANNERS.seconds, false); }
  window.scrollTo(0,0);
  if(adminSession) startOrdersListener();
  if(parts[0]==='pedido' && parts[1]) watchOrder(parts[1]);
}

async function boot(){
  document.getElementById('app').innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:'Baloo 2';font-size:20px;color:#0E7C7B;">🛍️ Cargando...</div>`;
  await loadAll();
  await initAuth();
  setupPWA();
  render();
}
boot();
</script>
